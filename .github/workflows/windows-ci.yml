name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows / ${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            rest: 'OFF'
            curl: 'OFF'
            vcpkg_packages: ''
          - name: rest
            rest: 'ON'
            curl: 'OFF'
            vcpkg_packages: nlohmann-json:x64-windows
          - name: rest-curl
            rest: 'ON'
            curl: 'ON'
            vcpkg_packages: nlohmann-json:x64-windows curl:x64-windows

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install vcpkg dependencies
        if: matrix.vcpkg_packages != ''
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_INSTALLATION_ROOT)) {
            throw 'The Windows runner did not provide VCPKG_INSTALLATION_ROOT.'
          }
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          if (-not (Test-Path -LiteralPath $vcpkg)) {
            throw "vcpkg executable not found: $vcpkg"
          }
          $packages = '${{ matrix.vcpkg_packages }}'.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
          & $vcpkg install $packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', '.',
            '-B', 'build',
            '-G', 'Visual Studio 17 2022',
            '-A', 'x64',
            '-DBUILD_TESTING=ON',
            '-DDISCORDCPP_WITH_REST_API=${{ matrix.rest }}',
            '-DDISCORDCPP_WITH_CURL=${{ matrix.curl }}'
          )
          if ('${{ matrix.rest }}' -eq 'ON') {
            if ([string]::IsNullOrWhiteSpace($env:VCPKG_INSTALLATION_ROOT)) {
              throw 'The Windows runner did not provide VCPKG_INSTALLATION_ROOT.'
            }
            $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
            if (-not (Test-Path -LiteralPath $toolchain)) {
              throw "vcpkg CMake toolchain not found: $toolchain"
            }
            $cmakeArgs += "-DCMAKE_TOOLCHAIN_FILE=$toolchain"
          }
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Debug
        shell: pwsh
        run: |
          $buildOutput = & cmake --build build --config Debug --parallel 2 2>&1
          $buildExitCode = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Output $_ }
          if ($buildExitCode -ne 0) {
            $buildText = $buildOutput -join "`n"
            if ($buildText -notmatch 'error C1041') { exit $buildExitCode }
            Write-Host 'MSVC reported C1041 (concurrent PDB access); retrying serially.'
            cmake --build build --config Debug -- /m:1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run CTest
        shell: pwsh
        run: |
          ctest --test-dir build -C Debug --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload CMake and CTest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-diagnostics-${{ matrix.name }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/CTestCostData.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log
